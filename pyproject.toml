[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "go1-tasks"
version = "0.1.0"
description = "Unitree Go1 velocity, MoB and CTS tasks for mjlab."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mjlab>=1.3.0",
  "rsl-rl-lib==5.0.1",
  "tensordict",
  "torch>=2.7.0",
  "viser>=1.0.26",
]

[project.scripts]
go1-train = "go1_tasks.cli:train"
go1-play = "go1_tasks.cli:play"
go1-eval-cts = "go1_tasks.cli:eval_cts"
go1-train-rma = "go1_tasks.cli:train_rma"
go1-list-tasks = "go1_tasks.cli:list_go1_tasks"

[project.entry-points."mjlab.tasks"]
go1 = "go1_tasks"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
]

[tool.uv.workspace]
members = ["framework/mjlab"]

[tool.uv]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
mjlab = { workspace = true }
warp-lang = { index = "nvidia", marker = "sys_platform != 'darwin'" }
torch = { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" }
mujoco-warp = { path = "vendor/mujoco_warp" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 2
extend-exclude = ["framework", "vendor"]
