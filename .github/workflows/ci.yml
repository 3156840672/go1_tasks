name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --locked

      - name: Smoke import (entry-point auto-load)
        run: |
          uv run python -c "import mjlab.tasks; from mjlab.tasks.registry import list_tasks; assert 'Go1-Velocity-CTS' in list_tasks(); assert 'Mjlab-Velocity-CTS-Unitree-Go1' in list_tasks()"
          uv run list-envs --keyword Go1

      - name: Run tests
        run: uv run pytest -q
