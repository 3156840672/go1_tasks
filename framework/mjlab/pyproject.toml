[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab"
version = "1.3.0"
license = "Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/BSD-3-Clause.txt"]
description = "Isaac Lab API, powered by MuJoCo-Warp, for RL and robotics research."
requires-python = ">=3.10,<3.14"
keywords = ["mujoco", "mujoco-warp", "simulation", "reinforcement-learning", "robotics"]
dependencies = [
  "imageio",
  "numpy",
  "onnx",
  "packaging",
  "prettytable",
  "PyYAML",
  "requests",
  "tqdm",
  "typing-extensions",
  "tyro>=1.0.1",
  "torch>=2.7.0",
  "torchrunx>=0.3.4",
  "warp-lang==1.12.0",
  "mujoco-warp>=3.7.0.1",
  "mujoco>=3.7.0,<3.8.0",
  "trimesh>=4.8.3",
  "viser>=1.0.26",
  "mjviser>=0.0.11",
  "mediapy>=1.2.6",
  "imageio-ffmpeg",
  "tensordict",
  "rsl-rl-lib==5.0.1",
  "tensorboard>=2.20.0",
  "onnxscript>=0.5.4",
  "wandb==0.22.3",
  "scipy>=1.10.0",
]

[project.scripts]
train = "mjlab.scripts.train:main"
play = "mjlab.scripts.play:main"
demo = "mjlab.scripts.demo:main"
list-envs = "mjlab.scripts.list_envs:main"
viz-nan = "mjlab.scripts.nan_viz:main"
export-scene = "mjlab.scripts.export_scene:main"
